<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Happy Birthday! 3D Celebration</title>
  <meta name="description"
    content="An interactive, modern 3D Birthday Celebration web experience with floating balloons, interactive multi-tier cake, candles, and music synth." />

  <!-- Web App Manifest & App Icons (Android & Windows Format) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-192.svg" />

  <!-- Android & iOS Mobile Web App Meta -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Birthday 3D" />

  <!-- Windows Desktop PWA Meta -->
  <meta name="msapplication-TileColor" content="#020617" />
  <meta name="msapplication-TileImage" content="icon-192.svg" />
  <meta name="application-name" content="Birthday 3D" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
            cursive: ['Great Vibes', 'cursive'],
          },
          colors: {
            festive: {
              pink: '#ff4b8b',
              purple: '#8b5cf6',
              gold: '#fbbf24',
              cyan: '#06b6d4',
            }
          },
          animation: {
            'glow-pulse': 'glowPulse 2s infinite alternate',
            'float-slow': 'floatSlow 4s ease-in-out infinite',
            'sparkle-spin': 'sparkleSpin 10s linear infinite',
          },
          keyframes: {
            glowPulse: {
              '0%': { filter: 'drop-shadow(0 0 15px rgba(255, 75, 139, 0.6))' },
              '100%': { filter: 'drop-shadow(0 0 30px rgba(251, 191, 36, 0.9))' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            sparkleSpin: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="h-full bg-slate-950 text-white overflow-hidden select-none font-sans">


  <!-- STAGE 0 — ❤️ SHOBANA'S CINEMATIC INTRO LAYER -->
  <div id="shobanaIntroLayer"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/98 backdrop-blur-3xl transition-all duration-700 select-none overflow-hidden font-sans p-6 text-center">

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600/25 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-pink-600/25 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-amber-500/15 rounded-full blur-[160px] pointer-events-none"></div>

    <!-- OPENING TYPOGRAPHY TEXT SEQUENCE -->
    <div class="w-full max-w-2xl flex items-center justify-center min-h-[220px]">
      <h1 id="sq-intro-text" class="sq-text-hidden text-2xl sm:text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-300 to-purple-200 tracking-wide leading-relaxed">
        Hi Shobana... ❤️
      </h1>
    </div>

  </div>

  <!-- STAGE 0B — 📝 SHOBANA'S 10-QUESTION BIRTHDAY QUIZ LAYER -->
  <div id="shobanaQuizLayer"
    class="hidden opacity-0 scale-95 fixed inset-0 z-50 flex items-center justify-center bg-slate-950 transition-all duration-700 select-none overflow-y-auto font-sans p-3 sm:p-6 bg-cover bg-center bg-no-repeat"
    style="background-image: url('photo2.jpg');">

    <!-- Dark Overlay for Background Image Contrast on Mobile & Desktop -->
    <div class="absolute inset-0 bg-slate-950/45 backdrop-blur-[1px] pointer-events-none"></div>

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-40 -left-40 w-72 h-72 sm:w-96 sm:h-96 bg-pink-600/20 rounded-full blur-[100px] sm:blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-72 h-72 sm:w-96 sm:h-96 bg-purple-600/20 rounded-full blur-[100px] sm:blur-[140px] pointer-events-none"></div>

    <!-- Playful Toast Reaction Notification -->
    <div id="sq-toast"
      class="fixed top-4 sm:top-8 left-1/2 -translate-x-1/2 z-50 px-4 py-2 sm:px-5 sm:py-2.5 rounded-2xl bg-slate-900/90 border border-pink-500/40 text-white text-xs sm:text-sm font-semibold shadow-2xl backdrop-blur-xl opacity-0 translate-y-4 pointer-events-none transition-all duration-300 flex items-center gap-2">
      <span id="sq-toast-text">Good choice ❤️</span>
    </div>

    <!-- QUIZ CARD CONTAINER (Mobile Formatted & Transparent Glassmorphic Box) -->
    <div id="sq-card"
      class="relative w-full max-w-[92%] sm:max-w-lg rounded-2xl sm:rounded-3xl p-5 sm:p-8 bg-slate-950/30 border border-white/30 shadow-[0_0_60px_rgba(244,114,182,0.25)] flex flex-col items-center text-center backdrop-blur-lg transition-all duration-500 sq-glass-card my-auto">
      

      <!-- Card Inner Content (Fades/Scales between questions) -->
      <div id="sq-card-content" class="w-full transition-all duration-300 opacity-100 scale-100">
        <!-- Question Title -->
        <h2 id="sq-question-title" class="text-lg sm:text-2xl font-bold text-white mb-6 leading-snug">
          Naan unakku enna? 😏
        </h2>

        <!-- Answer Options Buttons Container -->
        <div id="sq-options-container" class="w-full space-y-3">
          <!-- Rendered dynamically by shobanaQuiz.js -->
        </div>
      </div>

    </div>

  </div>

  <!-- STAGE 0C — ✨ TASK COMPLETION TRANSITION LAYER -->
  <div id="shobanaCompletionLayer"
    class="hidden opacity-0 scale-95 fixed inset-0 z-50 flex items-center justify-center bg-slate-950 transition-all duration-700 select-none overflow-hidden font-sans p-4 bg-cover bg-center bg-no-repeat"
    style="background-image: url('photo2.jpg');">

    <!-- Dark Overlay for Contrast -->
    <div class="absolute inset-0 bg-slate-950/45 backdrop-blur-[1px] pointer-events-none"></div>

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-40 -left-40 w-72 h-72 sm:w-96 sm:h-96 bg-pink-600/20 rounded-full blur-[100px] sm:blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-72 h-72 sm:w-96 sm:h-96 bg-purple-600/20 rounded-full blur-[100px] sm:blur-[140px] pointer-events-none"></div>

    <!-- Completion Glass Card -->
    <div class="relative w-full max-w-[92%] sm:max-w-lg rounded-2xl sm:rounded-3xl p-6 sm:p-10 bg-slate-950/30 border border-white/30 shadow-[0_0_80px_rgba(244,114,182,0.3)] flex flex-col items-center text-center backdrop-blur-lg transition-all duration-500 sq-glass-card my-auto">
      
      <div class="text-4xl sm:text-5xl mb-3 animate-bounce">🎉</div>

      <h2 id="sq-complete-text" class="text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-300 to-purple-200 tracking-wide leading-relaxed mb-2">
        ✨ QUIZ COMPLETED! ✨
      </h2>
      
      <p class="text-sm sm:text-base text-pink-200/90 font-medium mb-6">
        Ready for your special birthday surprise? 🎁
      </p>

      <!-- Surprise Button -->
      <button id="sq-surprise-btn"
        class="w-full sm:w-auto px-8 py-4 rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-amber-400 text-white font-black text-lg sm:text-xl shadow-[0_0_40px_rgba(244,114,182,0.5)] hover:shadow-[0_0_60px_rgba(244,114,182,0.8)] hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center gap-3 cursor-pointer border border-white/30">
        <span>Surprise 😁</span>
      </button>

    </div>

  </div>

  <!-- STAGE 1 — DARK ROOM + PULL-STRING LIGHT INTRO -->
  <div id="lamp-intro" class="lamp-intro-container">
    <!-- Ambient room light overlay -->
    <div id="room-light" class="room-light"></div>

    <!-- Lamp assembly -->
    <div id="lamp" class="lamp">
      <!-- Lampshade -->
      <div class="lampshade">
        <div class="lampshade-inner"></div>
        <!-- Bulb glow (visible when ON) -->
        <div id="bulb-glow" class="bulb-glow"></div>
      </div>

      <!-- Pull-string assembly -->
      <div id="pull-assembly" class="pull-assembly">
        <div id="pull-string" class="pull-string"></div>
        <div id="pull-handle" class="pull-handle" role="button" aria-label="Pull to toggle lamp" tabindex="0"></div>
      </div>

      <!-- Lamp stand -->
      <div class="lamp-stand"></div>

      <!-- Lamp base -->
      <div class="lamp-base"></div>

      <!-- Floor shadow -->
      <div id="floor-shadow" class="floor-shadow"></div>
    </div>

    <!-- Light cone beam -->
    <div id="light-cone" class="light-cone"></div>

    <!-- Dust particles container -->
    <div id="particles" class="particles"></div>

    <!-- Cursor glow -->
    <div id="cursor-glow" class="cursor-glow"></div>
  </div>

  <!-- CINEMATIC TRANSITION OVERLAY -->
  <div id="transition-overlay" class="transition-overlay"></div>

  <!-- STAGE 2 — 3D BIRTHDAY CAKE EXPERIENCE -->
  <div id="cake-experience" class="cake-experience-container">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="fixed inset-0 z-0"></div>

    <!-- Ambient Glow Overlay -->
    <div class="fixed inset-0 pointer-events-none z-10 bg-radial-gradient"></div>

    <!-- 3D BOOKLET LIGHTBOX MEDIA MODAL (Transparent Background) -->
    <div id="media-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/20 backdrop-blur-[2px] opacity-0 pointer-events-none transition-all duration-300">
      <div
        class="relative max-w-5xl w-11/12 max-h-[90vh] booklet-card-glass rounded-3xl p-2 sm:p-4 flex flex-col items-center justify-center transform scale-90 transition-all duration-300">

        <!-- Close Button -->
        <button id="modal-close"
          class="absolute top-2 right-2 sm:top-4 sm:right-4 z-30 text-amber-950 bg-amber-100/90 hover:bg-amber-200 p-2.5 rounded-full shadow-lg border border-amber-300/80 backdrop-blur-md transition hover:scale-105 active:scale-95 cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <!-- Manual Previous Arrow Button -->
        <button id="modal-prev-btn"
          class="absolute left-1 sm:left-3 top-1/2 -translate-y-1/2 z-30 text-amber-900 bg-amber-100/90 hover:bg-amber-200 p-3 sm:p-3.5 rounded-full shadow-xl border border-amber-300/80 backdrop-blur-md transition hover:scale-110 active:scale-95 group cursor-pointer">
          <i data-lucide="chevron-left" class="w-6 h-6 transition-transform group-hover:-translate-x-0.5"></i>
        </button>

        <!-- Manual Next Arrow Button -->
        <button id="modal-next-btn"
          class="absolute right-1 sm:right-3 top-1/2 -translate-y-1/2 z-30 text-amber-900 bg-amber-100/90 hover:bg-amber-200 p-3 sm:p-3.5 rounded-full shadow-xl border border-amber-300/80 backdrop-blur-md transition hover:scale-110 active:scale-95 group cursor-pointer">
          <i data-lucide="chevron-right" class="w-6 h-6 transition-transform group-hover:translate-x-0.5"></i>
        </button>

        <!-- 3D BOOKLET CONTAINER -->
        <div id="booklet-wrapper" class="w-full flex flex-col items-center justify-center">
          <!-- Main 3D Book Frame -->
          <div id="booklet-book" class="booklet-book">
            <!-- Spine shadow center line -->
            <div class="booklet-spine"></div>

            <!-- Left Page Display -->
            <div id="booklet-page-left" class="booklet-page booklet-page-left">
              <div class="booklet-page-inner" id="page-left-content">
                <!-- Decorative / Previous content -->
              </div>
            </div>

            <!-- Right Page Display (Main Active Media Page) -->
            <div id="booklet-page-right" class="booklet-page booklet-page-right">
              <div class="booklet-page-inner" id="page-right-content">
                <!-- Main image / video content -->
              </div>
            </div>

            <!-- Animated 3D Flipping Page Leaf -->
            <div id="booklet-flip-leaf" class="booklet-flip-leaf">
              <div class="booklet-leaf-front" id="leaf-front-content"></div>
              <div class="booklet-leaf-back" id="leaf-back-content"></div>
              <div class="booklet-leaf-shadow" id="leaf-shadow"></div>
            </div>

            <!-- Page Corner Click Prompts -->
            <div id="corner-flip-next" class="booklet-corner-fold booklet-corner-tr" title="Click to flip page">
            </div>
            <div id="corner-flip-prev" class="booklet-corner-fold booklet-corner-tl" title="Click to flip back">
            </div>
          </div>

          <!-- Booklet Footer Bar with Gold Page Indicator & Download Option -->
          <div
            class="mt-4 flex flex-wrap items-center justify-center gap-3 w-full max-w-2xl px-4 text-xs font-medium">
            <div id="modal-indicator"
              class="px-4 py-1.5 bg-amber-100/90 border border-amber-300/80 rounded-full font-serif font-bold text-amber-950 shadow-md backdrop-blur-md">
              Page 1 of 16
            </div>
            <button id="modal-download-btn"
              title="Download currently displayed image"
              class="px-4 py-1.5 bg-gradient-to-r from-amber-500 via-pink-500 to-purple-600 hover:from-amber-600 hover:to-purple-700 text-white font-bold rounded-full shadow-md border border-amber-300/60 backdrop-blur-md transition hover:scale-105 active:scale-95 flex items-center gap-1.5 cursor-pointer">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Download Photo</span>
            </button>
          </div>
        </div>

        <!-- Hidden Title Element -->
        <p id="modal-title" class="hidden"></p>
      </div>
    </div>

    <!-- FLOATING BOTTOM LEFT ACTION BUTTON -->
    <div class="fixed bottom-6 left-6 z-20">
      <button id="blow-btn"
        class="liquid-glass-btn py-2.5 px-4 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 tracking-wide text-white">
        <span id="blow-text">❤️ Let’s make it unforgettable!</span>
      </button>
    </div>

  </div>

  <!-- JavaScript Main Logic -->
  <script src="main.js?v=14"></script>
  <!-- Shobana's Birthday Intro & 10-Question Quiz Engine -->
  <script src="shobanaQuiz.js"></script>

  <!-- Initialize Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>

  <!-- Service Worker Registration for Windows & Android PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
